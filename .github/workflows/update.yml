# Fantasy ยังไงดี: builds the leaderboard site from FPL and publishes it on GitHub Pages.
# Everything it needs is in this one file.
name: Update leaderboard

on:
  schedule:
    - cron: "17 1 * * *"       # every morning at 08:17 Bangkok time
    - cron: "17 11-23 * * *"   # every hour 18:17–06:17 Bangkok time, when Premier League matches are played
  workflow_dispatch:           # "Run workflow" button for an update right now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep FPL data from earlier runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: fpl-${{ github.run_id }}
          restore-keys: fpl-

      - name: Install the preview-image tool
        run: pip install playwright==1.48.0

      - name: Write the scripts
        run: |
          mkdir -p scripts
          cat > scripts/fetch.py <<'SCRIPTEOF'
          """Fetch FPL league data: game status, league standings and each team's gameweek history.
          Usage: python3 fetch.py <data_dir> <league_id>
          Picks and live points (only needed to break a tie) are fetched later by compute.py, on demand."""
          import json, os, sys, time, urllib.request

          data_dir, league_id = sys.argv[1], sys.argv[2]
          BASE = "https://fantasy.premierleague.com/api"


          def get(path, cache):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(BASE + path, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          d = json.loads(r.read())
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))
              json.dump(d, open(os.path.join(data_dir, cache), "w"))
              time.sleep(0.15)
              return d


          os.makedirs(os.path.join(data_dir, "hist"), exist_ok=True)
          boot = get("/bootstrap-static/", "bootstrap.json")
          league = get(f"/leagues-classic/{league_id}/standings/", "league.json")
          entries = [r["entry"] for r in league["standings"]["results"]]
          for eid in entries:
              get(f"/entry/{eid}/history/", f"hist/{eid}.json")
          finished = [e["id"] for e in boot["events"] if e["finished"] and e["data_checked"]]
          print("entries", len(entries), "finished GWs", finished)
          SCRIPTEOF
          cat > scripts/compute.py <<'SCRIPTEOF'
          """Compute league prizes per the group's rules. Usage: python3 -I compute.py <data_dir> <out_json>"""
          import json, os, sys

          data_dir, out = sys.argv[1], sys.argv[2]
          FEE = 3000
          SEASON_PCT = [18, 10, 7, 6, 5, 4]
          WEEK_PCT, HALF_PCT, GWMAX_PCT, IMPROVE_PCT = 1, 3, 3, 3

          L = lambda p: json.load(open(os.path.join(data_dir, p)))
          boot, league = L("bootstrap.json"), L("league.json")
          finished = [e["id"] for e in boot["events"] if e["finished"] and e["data_checked"]]
          current_gw = max(finished)
          members = [{"entry": r["entry"], "team": r["entry_name"], "manager": r["player_name"].strip()}
                     for r in league["standings"]["results"]]
          ids = [m["entry"] for m in members]
          pot = FEE * len(members)
          pct = lambda p: pot * p / 100

          # net points per GW (gross points minus transfer hits)
          net, total = {}, {}
          for eid in ids:
              h = L(f"hist/{eid}.json")["current"]
              net[eid] = {r["event"]: r["points"] - r["event_transfers_cost"] for r in h}
              total[eid] = h[-1]["total_points"] if h else 0
              assert sum(net[eid].values()) == total[eid], eid

          # A gameweek whose matches have started but that FPL has not closed yet (finished + data_checked).
          # Its points already count in the totals, so the site shows it as provisional;
          # its weekly prize waits until FPL closes it.
          cur_ev = next((e for e in boot["events"] if e["is_current"]), None)
          provisional_gw = None
          if cur_ev and cur_ev["id"] > current_gw and any(net[e].get(cur_ev["id"], 0) for e in ids):
              provisional_gw = cur_ev["id"]
          show_gw = provisional_gw or current_gw

          def cached(path, cache):
              """Picks and live points of a finished GW never change, so they are fetched once and kept."""
              fn = os.path.join(data_dir, cache)
              if os.path.exists(fn):
                  return json.load(open(fn))
              import time, urllib.request
              os.makedirs(os.path.dirname(fn), exist_ok=True)
              for attempt in range(4):
                  try:
                      req = urllib.request.Request("https://fantasy.premierleague.com/api" + path,
                                                   headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          d = json.loads(r.read())
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))
              json.dump(d, open(fn, "w"))
              return d

          _live = {}
          def live_points(gw):
              if gw not in _live:
                  _live[gw] = {e["id"]: e["stats"]["total_points"]
                               for e in cached(f"/event/{gw}/live/", f"live/{gw}.json")["elements"]}
              return _live[gw]

          def tiebreak(eid, gw):
              """Weekly tie-break order: all 15 players' points, captain, vice-captain, goalkeeper."""
              p = cached(f"/entry/{eid}/event/{gw}/picks/", f"picks/{eid}_{gw}.json")
              lp = live_points(gw)
              picks = p["picks"]
              all15 = sum(lp.get(x["element"], 0) for x in picks)
              cap = next(x["element"] for x in picks if x["is_captain"])
              vc = next(x["element"] for x in picks if x["is_vice_captain"])
              xi = [x["element"] for x in picks if x["position"] <= 11]
              for s in p.get("automatic_subs", []):
                  if s["element_out"] in xi:
                      xi[xi.index(s["element_out"])] = s["element_in"]
              gk = next(x["element"] for x in picks if x["element"] in xi and x["element_type"] == 1)
              return [all15, lp.get(cap, 0), lp.get(vc, 0), lp.get(gk, 0)]

          won = {eid: 0.0 for eid in ids}
          weeks = []
          for gw in finished:
              scores = {eid: net[eid].get(gw, 0) for eid in ids}
              top = max(scores.values())
              tied = [eid for eid in ids if scores[eid] == top]
              tb = None
              if len(tied) > 1:
                  tb = {eid: tiebreak(eid, gw) for eid in tied}
                  best = max(tb.values())
                  winners = [eid for eid in tied if tb[eid] == best]
              else:
                  winners = tied
              for w in winners:
                  won[w] += pct(WEEK_PCT) / len(winners)
              weeks.append({"gw": gw, "scores": scores, "top": top, "tied": tied,
                            "tiebreak": tb, "winners": winners})

          def leaders(vals):
              best = max(vals.values())
              return [k for k, v in vals.items() if v == best], best

          # season ranking: total, then H2H from latest GW backwards
          order = sorted(ids, key=lambda e: [total[e]] + [net[e].get(g, 0) for g in sorted(finished, reverse=True)], reverse=True)
          season = [{"entry": e, "rank": i + 1, "total": total[e],
                     "projected": pct(SEASON_PCT[i]) if i < len(SEASON_PCT) else 0} for i, e in enumerate(order)]

          h1 = {e: sum(v for g, v in net[e].items() if g <= 19) for e in ids}
          h2 = {e: sum(v for g, v in net[e].items() if g >= 20) for e in ids}
          gwmax = {e: max(net[e].values()) for e in ids}
          h1_lead, h1_best = leaders(h1)
          gm_lead, gm_best = leaders(gwmax)
          gm_when = {e: [g for g, v in net[e].items() if v == gm_best] for e in gm_lead}

          result = {
              "league": league["league"]["name"], "league_id": league["league"]["id"],
              "current_gw": current_gw, "next_gw": current_gw + 1, "fee": FEE, "pot": pot,
              "show_gw": show_gw, "provisional_gw": provisional_gw,
              "members": members, "net": {str(e): net[e] for e in ids}, "total": {str(e): total[e] for e in ids},
              "weeks": weeks, "weekly_won": {str(e): won[e] for e in ids},
              "season": season,
              "half1": {"scores": {str(e): h1[e] for e in ids}, "leaders": h1_lead, "best": h1_best, "prize": pct(HALF_PCT)},
              "half2": {"scores": {str(e): h2[e] for e in ids}, "prize": pct(HALF_PCT), "started": current_gw >= 20},
              "gwmax": {"scores": {str(e): gwmax[e] for e in ids}, "leaders": gm_lead, "best": gm_best,
                        "when": {str(k): v for k, v in gm_when.items()}, "prize": pct(GWMAX_PCT)},
              "improve": {"prize": pct(IMPROVE_PCT), "started": current_gw >= 20},
              "pct_check": sum(SEASON_PCT) + 38 * WEEK_PCT + 2 * HALF_PCT + GWMAX_PCT + IMPROVE_PCT,
          }
          json.dump(result, open(out, "w"), ensure_ascii=False, indent=1)

          name = {m["entry"]: m["manager"] for m in members}
          print("pot", pot, "pct total", result["pct_check"], "GW", current_gw, "provisional GW", provisional_gw)
          for w in weeks:
              print(f"GW{w['gw']:2d} top {w['top']:3d} tied {[name[t] for t in w['tied']]} tb {w['tiebreak']} -> {[name[x] for x in w['winners']]}")
          print("half1 leaders", [name[x] for x in h1_lead], h1_best)
          print("gwmax", [name[x] for x in gm_lead], gm_best, gm_when)
          for s in season:
              print(s["rank"], name[s["entry"]], s["total"], s["projected"], "weekly won", won[s["entry"]])
          SCRIPTEOF
          cat > scripts/make_files.py <<'SCRIPTEOF'
          """Turn league_data.json (from compute.py) into the dashboard's data files.
          Usage: python3 -I make_files.py <league_data.json> <scripts_dir> <out_dir>
          Each file is {rows, meta}; meta carries the code that made it."""
          import json, os, sys

          src, scripts_dir, out_dir = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.load(open(src))
          os.makedirs(out_dir, exist_ok=True)

          SEASON_PCT = [18, 10, 7, 6, 5, 4]
          pot = d["pot"]
          cur = d["current_gw"]                  # last GW that FPL has closed (prizes go by this)
          show = d.get("show_gw") or cur         # GW the site shows: the in-progress one, if any
          prov = d.get("provisional_gw")
          mem = {m["entry"]: m for m in d["members"]}
          name = lambda e: mem[e]["manager"]
          fmt_names = lambda es: ", ".join(name(e) for e in es)

          code = [{"label": fn, "value": open(os.path.join(scripts_dir, fn)).read(), "type": "code", "lang": "python"}
                  for fn in ("fetch.py", "compute.py", "make_files.py")]
          meta = code + [{"label": "Input", "value": f"FPL API, classic league {d['league_id']}, GW1–{show}"
                                                     + (f" (GW{prov} provisional)" if prov else "")}]

          # ---- special awards (projected leaders, split on ties) ----
          award_share = {e: 0.0 for e in mem}
          awards = []
          for i, s in enumerate(d["season"][:6]):
              awards.append({"id": f"season{i+1}", "kind": "season", "name": f"อันดับ {i+1} จบฤดูกาล", "pct": SEASON_PCT[i],
                             "baht": pot * SEASON_PCT[i] / 100, "leader": name(s["entry"]), "value": s["total"],
                             "detail": f"{s['total']} แต้ม", "status": "ตัดสินแล้ว" if cur >= 38 else "ถ้าจบวันนี้"})

          def special(aid, title, leaders, value, detail, status):
              prize = pot * 3 / 100
              for e in leaders:
                  award_share[e] += prize / len(leaders)
              awards.append({"id": aid, "kind": "special", "name": title, "pct": 3, "baht": prize,
                             "leader": fmt_names(leaders) if leaders else None, "value": value,
                             "detail": detail, "status": status})

          h1, h2 = d["half1"], d["half2"]
          special("half1", "แชมป์ครึ่งฤดูกาลแรก (GW1–19)", h1["leaders"], h1["best"],
                  f"{h1['best']} แต้ม" + (" (แบ่งกัน)" if len(h1["leaders"]) > 1 else ""),
                  "ตัดสินแล้ว" if cur >= 19 else "นำอยู่")

          if cur >= 20:
              s2 = {int(k): v for k, v in h2["scores"].items()}
              best = max(s2.values()); lead2 = [e for e, v in s2.items() if v == best]
              special("half2", "แชมป์ครึ่งฤดูกาลหลัง (GW20–38)", lead2, best, f"{best} แต้ม",
                      "ตัดสินแล้ว" if cur >= 38 else "นำอยู่")
              s1 = {int(k): v for k, v in h1["scores"].items()}
              n2 = cur - 19
              # until GW38 the halves have different lengths, so compare per-GW averages
              imp = {e: (s2[e] / n2 - s1[e] / 19) if cur < 38 else (s2[e] - s1[e]) for e in s1}
              bi = max(imp.values()); lead_i = [e for e, v in imp.items() if abs(v - bi) < 1e-9]
              special("improve", "พัฒนาการดีที่สุด (19 วีกหลัง − 19 วีกแรก)", lead_i, round(bi, 1),
                      (f"+{bi:.0f} แต้ม" if cur >= 38 else f"+{bi:.1f} แต้ม/วีก (เทียบค่าเฉลี่ย)"),
                      "ตัดสินแล้ว" if cur >= 38 else "นำอยู่")
          else:
              special("half2", "แชมป์ครึ่งฤดูกาลหลัง (GW20–38)", [], None, "เริ่มนับ GW20", "ยังไม่เริ่ม")
              special("improve", "พัฒนาการดีที่สุด (19 วีกหลัง − 19 วีกแรก)", [], None, "เริ่มวัดหลัง GW20", "ยังไม่เริ่ม")

          gm = d["gwmax"]
          gm_detail = ", ".join(f"GW{g}" for e in gm["leaders"] for g in gm["when"][str(e)])
          special("gwmax", "แต้มสูงสุดใน 1 วีกของฤดูกาล", gm["leaders"], gm["best"], f"{gm['best']} แต้ม ({gm_detail})",
                  "ตัดสินแล้ว" if cur >= 38 else "นำอยู่")

          # ---- weekly winners (newest first) ----
          weekly = []
          for w in sorted(d["weeks"], key=lambda w: -w["gw"]):
              split = len(w["winners"])
              note = ""
              if len(w["tied"]) > 1:
                  note = "เสมอ " + fmt_names(w["tied"]) + " → ตัดสินด้วย 15 ตัว/กัปตัน/รองกัปตัน/GK"
                  if split > 1:
                      note += " ยังเท่ากัน แบ่งรางวัล"
              weekly.append({"gw": w["gw"], "winner": fmt_names(w["winners"]),
                             "team": ", ".join(mem[e]["team"] for e in w["winners"]),
                             "winner_entry": ",".join(str(e) for e in w["winners"]),
                             "points": w["top"], "baht": pot / 100, "note": note or None})

          # ---- standings ----
          weekly_won = {int(k): v for k, v in d["weekly_won"].items()}
          wins = {e: 0.0 for e in mem}
          for w in d["weeks"]:
              for e in w["winners"]:
                  wins[e] += 1 / len(w["winners"])
          leader_total = d["season"][0]["total"]
          standings = []
          for s in d["season"]:
              e = s["entry"]
              proj = weekly_won[e] + s["projected"] + award_share[e]
              standings.append({"rank": s["rank"], "entry": e, "team": mem[e]["team"], "manager": mem[e]["manager"],
                                "total": s["total"], "gap": s["total"] - leader_total,
                                "gw_points": d["net"][str(e)].get(str(show), 0),
                                "weekly_wins": round(wins[e], 2), "weekly_baht": weekly_won[e],
                                "season_baht": s["projected"], "award_baht": award_share[e],
                                "projected_baht": proj, "gw": show,
                                "provisional": bool(prov), "final_gw": cur})

          # ---- points per GW, wide (one column per GW) ----
          scores = []
          for s in d["season"]:
              e = s["entry"]
              row = {"entry": e, "manager": mem[e]["manager"], "team": mem[e]["team"]}
              for g in range(1, show + 1):
                  row[f"GW{g}"] = d["net"][str(e)].get(str(g), 0)
              scores.append(row)

          for fn, rows in [("standings", standings), ("weekly", weekly), ("awards", awards), ("scores", scores)]:
              json.dump({"rows": rows, "meta": meta}, open(os.path.join(out_dir, fn + ".json"), "w"), ensure_ascii=False)
          assert abs(sum(a["pct"] for a in awards) + 38 - 100) < 1e-9
          print("projected payout", sum(r["projected_baht"] for r in standings), "of pot", pot)
          for r in standings:
              print(r["rank"], r["manager"], r["total"], r["gap"], r["weekly_baht"], r["season_baht"], r["award_baht"], r["projected_baht"])
          SCRIPTEOF
          cat > scripts/build_site.py <<'SCRIPTEOF'
          """Render the league's standalone website (no Claude needed to view it).
          Usage: python3 build_site.py <files_dir> <out_dir>
          Reads standings/weekly/awards/scores.json made by make_files.py and writes index.html."""
          import json, os, sys
          from html import escape as E

          files_dir, out_dir = sys.argv[1], sys.argv[2]
          os.makedirs(out_dir, exist_ok=True)
          R = lambda n: json.load(open(os.path.join(files_dir, n + ".json")))["rows"]
          standings, weekly, awards, scores = R("standings"), R("weekly"), R("awards"), R("scores")

          FEE = 3000
          SITE_URL = os.environ.get("SITE_URL", "")  # full site address, so LINE can load the preview image
          members = len(standings)
          pot = members * FEE
          gw = max(r["gw"] for r in standings)
          # provisional: FPL has not closed this GW yet, so its points can still change and its weekly prize waits
          prov = any(r.get("provisional") for r in standings)
          gw_tag = f"GW{gw} ชั่วคราว" if prov else f"GW{gw}"
          paid = sum(r["baht"] for r in weekly)
          standings.sort(key=lambda r: r["rank"])
          leader = standings[0]
          lead = leader["total"] - standings[1]["total"] if members > 1 else 0

          def n(v):
              if v is None:
                  return "—"
              return f"{v:,.0f}" if float(v).is_integer() else f"{v:,.1f}"

          def badge(rank):
              cls = f" r{rank}" if rank <= 3 else ""
              return f'<span class="rank{cls}">{rank}</span>'

          # ---- leaderboard ----
          rows_html = []
          for r in standings:
              gap = "" if r["gap"] == 0 else f'<span class="chip">ห่าง <b>{n(r["gap"])}</b></span>'
              rows_html.append(f"""
          <li class="row{' money' if r['rank'] <= 6 else ''}">
            {badge(r['rank'])}
            <div class="who"><span class="team">{E(r['team'])}</span><span class="mgr">{E(r['manager'])}</span></div>
            <div class="pts"><span class="pts-num">{n(r['total'])}</span><span class="pts-lbl">แต้ม</span></div>
            <div class="meta">
              <span class="chip">{gw_tag} <b>{n(r['gw_points'])}</b></span>{gap}
              <span class="chip c-money">ได้แล้ว <b>{n(r['weekly_baht'])}</b> ฿</span>
              <span class="chip c-proj">ถ้าจบวันนี้ <b>{n(r['projected_baht'])}</b> ฿</span>
            </div>
          </li>""")
              if r["rank"] == 6 and members > 6:
                  rows_html.append('<li class="cut" aria-hidden="true">เส้นรับเงินจบฤดูกาล · Top 6</li>')

          # ---- weekly winners ----
          weeks_html = []
          for i, w in enumerate(sorted(weekly, key=lambda w: -w["gw"])):
              note = f'<span class="w-note">{E(w["note"])}</span>' if w.get("note") else ""
              weeks_html.append(f"""
          <li class="week{' latest' if i == 0 else ''}">
            <span class="w-gw">GW{w['gw']}</span>
            <span class="w-name">{E(w['winner'])}</span>
            <span class="w-team">{E(w['team'])}</span>
            <span class="w-pts">{n(w['points'])} <small>แต้ม</small></span>
            <span class="w-baht">+{n(w['baht'])} บาท</span>{note}
          </li>""")

          # the GW FPL has not closed yet: show who is ahead, but no prize until it is final
          if prov:
              col = f"GW{gw}"
              top = max(r[col] for r in scores)
              ahead = [r for r in scores if r[col] == top]
              weeks_html.insert(0, f"""
          <li class="week pending">
            <span class="w-gw">GW{gw} · รอ FPL ปิดวีก</span>
            <span class="w-name">{E(", ".join(r["manager"] for r in ahead))}</span>
            <span class="w-team">{E(", ".join(r["team"] for r in ahead))}</span>
            <span class="w-pts">{n(top)} <small>แต้ม</small></span>
            <span class="w-baht">นำอยู่ · ยังไม่ตัดสิน</span>
          </li>""")

          # ---- special awards ----
          STATUS = {"นำอยู่": "lead", "ถ้าจบวันนี้": "lead", "ตัดสินแล้ว": "done"}
          order = ["half1", "half2", "gwmax", "improve"]
          awards_html = []
          for a in sorted([a for a in awards if a["kind"] == "special"], key=lambda a: order.index(a["id"])):
              awards_html.append(f"""
          <div class="award">
            <div class="a-top"><span class="a-name">{E(a['name'])}</span><span class="pill {STATUS.get(a['status'], '')}">{E(a['status'])}</span></div>
            <div class="a-baht">{n(a['baht'])} <small>บาท ({n(a['pct'])}%)</small></div>
            <div class="a-leader">{E(a['leader'] or '—')}</div>
            <div class="a-detail">{E(a['detail'] or '')}</div>
          </div>""")

          # ---- season prizes ----
          prizes_html = []
          for i, a in enumerate(sorted([a for a in awards if a["kind"] == "season"], key=lambda a: -a["pct"])):
              prizes_html.append(f"""
          <li class="prize">
            {badge(i + 1)}
            <div class="who"><span class="team">{E(a['leader'] or '—')}</span><span class="mgr">{n(a['value'])} แต้ม · {n(a['pct'])}% ของกองกลาง</span></div>
            <div class="p-baht">{n(a['baht'])}<small>บาท</small></div>
          </li>""")

          # ---- heatmap ----
          cols = sorted([c for c in scores[0] if c.startswith("GW")], key=lambda c: int(c[2:]))
          win = {f"GW{w['gw']}": str(w["winner_entry"]).split(",") for w in weekly}
          ext = {c: (min(r[c] for r in scores), max(r[c] for r in scores)) for c in cols}
          head = '<th class="h-name">ทีม</th>' + "".join(
              f"<th>{c}*</th>" if prov and c == f"GW{gw}" else f"<th>{c}</th>" for c in cols)
          body = []
          for r in scores:
              cells = []
              for c in cols:
                  lo, hi = ext[c]
                  t = (r[c] - lo) / (hi - lo) if hi > lo else 1
                  w = " win" if str(r["entry"]) in win.get(c, []) else ""
                  cells.append(f'<td class="{w.strip()}" style="--t:{0.05 + 0.61 * t:.3f}">{n(r[c])}</td>')
              body.append(f'<tr><td class="h-name">{E(r["team"])}</td>{"".join(cells)}</tr>')

          latest = max(weekly, key=lambda w: w["gw"]) if weekly else None
          og_desc = (f"GW{gw} (แต้มชั่วคราว)" if prov else f"หลัง GW{gw}") + f": {leader['team']} นำ {leader['total']} แต้ม · กองกลาง {pot:,} บาท"
          hero_gw = f"<b>GW{gw}</b> · แต้มชั่วคราว รอ FPL ยืนยัน" if prov else f"อัปเดตหลังจบ <b>GW{gw}</b>"
          prov_note = (f'<p class="prov-note">แต้ม GW{gw} ยังเป็นแต้มชั่วคราว รอ FPL ยืนยัน (อาจขยับได้เล็กน้อย) · '
                       f'แต้มรวมและอันดับนับ GW{gw} แล้ว · แชมป์ประจำวีก GW{gw} จะประกาศเมื่อ FPL ปิดวีก</p>') if prov else ""

          html = f"""<!doctype html>
