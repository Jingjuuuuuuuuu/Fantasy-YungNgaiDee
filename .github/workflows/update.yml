                <li>แต้มสูงสุดใน 1 วีกของฤดูกาล 3% · พัฒนาการดีที่สุด (แต้ม 19 วีกหลัง − 19 วีกแรก) 3%</li>
                <li>แชมป์ประจำวีกแต้มเท่ากัน: ดูแต้ม 15 ตัว → แต้มกัปตัน → แต้มรองกัปตัน → แต้ม GK</li>
                <li>รางวัลพิเศษ 4 รางวัล ถ้าแต้มเท่ากันให้หารกัน</li>
                <li>อันดับจบฤดูกาลแต้มเท่ากัน: ดูแต้ม GW38 → GW37 ไล่ย้อนไปเรื่อยๆ</li>
                <li>ระหว่างฤดูกาลหลัง (ก่อนจบ GW38) รางวัลพัฒนาการเทียบจากแต้มเฉลี่ยต่อวีก เพราะจำนวนวีกยังไม่เท่ากัน</li>
              </ul>
            </details>
