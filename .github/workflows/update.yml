          background:radial-gradient(120% 140% at 100% 0%,rgba(233,0,82,.6),rgba(233,0,82,0) 55%),radial-gradient(90% 120% at 0% 100%,rgba(0,255,133,.22),rgba(0,255,133,0) 60%),linear-gradient(150deg,#22002a,#37003c 50%,#4b0a5a);
          display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box}}
          .t{{font-size:26px;letter-spacing:.1em;color:#00ff85;text-transform:uppercase}}h1{{font-size:96px;margin:6px 0 10px;line-height:1}}
          p{{font-size:40px;margin:0;color:rgba(255,255,255,.9)}}b{{color:#00ff85}}.pot{{margin-top:34px;font-size:34px;color:rgba(255,255,255,.75)}}</style></head>
          <body><div class="t">⚽ Fantasy Premier League · {gw_tag}</div><h1>Fantasy ยังไงดี</h1>
          <p><b>{E(leader['team'])}</b> นำจ่าฝูง {n(leader['total'])} แต้ม</p><div class="pot">กองกลาง <b>{n(pot)}</b> บาท · {members} คน</div></body></html>"""
          open(os.path.join(out_dir, "og.html"), "w").write(og)
          print("built", os.path.join(out_dir, "index.html"))
          SCRIPTEOF
          cat > scripts/og.py <<'SCRIPTEOF'
          """Turn og.html into og.png, the picture LINE shows under the link.
          Usage: python3 og.py <site_dir>
          A failure here only means no preview picture, so it never stops the site from updating."""
          import os, sys

          site = os.path.abspath(sys.argv[1])
          try:
              from playwright.sync_api import sync_playwright
              chrome = next((p for p in ("/usr/bin/google-chrome", "/usr/bin/chromium", "/usr/bin/chromium-browser")
                             if os.path.exists(p)), None)
              with sync_playwright() as p:
                  b = p.chromium.launch(executable_path=chrome, args=["--no-sandbox"])
                  pg = b.new_page(viewport={"width": 1200, "height": 630})
                  pg.goto(f"file://{site}/og.html")
                  pg.wait_for_timeout(2000)
                  pg.screenshot(path=os.path.join(site, "og.png"))
                  b.close()
              print("og.png written")
          except Exception as e:  # noqa: BLE001
              print("skipped og.png:", e)
          finally:
              if os.path.exists(os.path.join(site, "og.html")):
                  os.remove(os.path.join(site, "og.html"))
          SCRIPTEOF
          cat > scripts/run.sh <<'SCRIPTEOF'
          #!/usr/bin/env bash
          # Rebuild the leaderboard site from live FPL data.
          # LEAGUE_ID: the FPL classic league. SITE_URL: the site's address (for the LINE preview image).
          set -euo pipefail
          cd "$(dirname "$0")/.."
          LEAGUE_ID="${LEAGUE_ID:-315129}"
          CACHE=.cache
          OUT=_site

          mkdir -p "$CACHE" "$OUT/data"
          python3 scripts/fetch.py "$CACHE" "$LEAGUE_ID"
          python3 scripts/compute.py "$CACHE" "$CACHE/league_data.json"
          python3 scripts/make_files.py "$CACHE/league_data.json" scripts "$OUT/data"
          python3 scripts/build_site.py "$OUT/data" "$OUT"
          python3 scripts/og.py "$OUT"
          touch "$OUT/.nojekyll"

          # Keep a copy of the numbers in the repo, so each gameweek's result stays in its history.
          mkdir -p data
          cp "$OUT"/data/*.json data/
          SCRIPTEOF

      - name: Build the site from FPL
        run: bash scripts/run.sh
        env:
          LEAGUE_ID: "315129"
          SITE_URL: "https://jingjuuuuuuuuu.github.io/Fantasy-YungNgaiDee/"

      - name: Save this gameweek's numbers in the repo
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            GW=$(python3 -c "import json;print(json.load(open('data/standings.json'))['rows'][0]['gw'])")
            PROV=$(python3 -c "import json;print('yes' if json.load(open('data/standings.json'))['rows'][0].get('provisional') else '')")
            if [ -n "$PROV" ]; then
              git commit -m "Update standings: GW${GW} provisional"
            else
              git commit -m "Update standings after GW${GW}"
            fi
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4